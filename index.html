    <style>
        body {
            font-family: 'Rajdhani', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            overflow-x: hidden;
        }

        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
        }

        .btn-answer {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn-answer:hover:not(:disabled) {
            transform: scale(1.02) translateX(5px);
            background-color: #334155;
            border-color: #3b82f6;
        }

        .shake {
            animation: shake 0.5s infinite;
        }

        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(5px); }
            50% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
            100% { transform: translateX(0); }
        }

        .timer-bar {
            transition: width 0.1s linear, background-color 0.5s ease;
        }

        .fade-in {
            animation: fadeIn 0.5s ease-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }

        .power-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.5rem;
        }

        .review-item {
            background: rgba(15, 23, 42, 0.5);
            border-radius: 12px;
            padding: 10px;
            margin-bottom: 8px;
            border-left: 4px solid #ccc;
        }
        .review-correct { border-left-color: #10b981; }
        .review-wrong { border-left-color: #ef4444; }

        #instant-feedback {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 5rem;
            font-weight: 900;
            z-index: 100;
            pointer-events: none;
            opacity: 0;
            transition: all 0.5s;
        }
        .show-feedback {
            animation: popFeedback 0.8s ease-out forwards;
        }
        @keyframes popFeedback {
            0% { opacity: 0; transform: translate(-50%, -50%) scale(0.5); }
            50% { opacity: 1; transform: translate(-50%, -50%) scale(1.2); }
            100% { opacity: 0; transform: translate(-50%, -70%) scale(1); }
        }

        .live-tag {
            animation: pulse-red 2s infinite;
        }
        @keyframes pulse-red {
            0% { opacity: 0.5; }
            50% { opacity: 1; }
            100% { opacity: 0.5; }
        }
    </style>
</head>

    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const synth = window.speechSynthesis;

        function sayText(text, isMock = false) {
            if (synth.speaking) synth.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'id-ID';
            utterance.pitch = isMock ? 1.5 : 1.0; 
            utterance.rate = 1.2;
            synth.speak(utterance);
        }

        function playSound(type) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            if (type === 'correct') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
                osc.start(); osc.stop(audioCtx.currentTime + 0.2);
                sayText("Hore!");
                showInstantFeedback("HORE", "#10b981");
            } else if (type === 'wrong') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start(); osc.stop(audioCtx.currentTime + 0.3);
                sayText("Wuuuu, ledek!", true);
                showInstantFeedback("LEDEK", "#ef4444");
            } else if (type === 'click') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(440, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
                osc.start(); osc.stop(audioCtx.currentTime + 0.05);
            } else if (type === 'sabotage') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(100, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(50, audioCtx.currentTime + 0.5);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
                osc.start(); osc.stop(audioCtx.currentTime + 0.5);
            }
        }

        function showInstantFeedback(text, color) {
            const el = document.getElementById('instant-feedback');
            el.innerText = text;
            el.style.color = color;
            el.classList.remove('show-feedback');
            void el.offsetWidth; 
            el.classList.add('show-feedback');
        }
    </script>

        // --- GAME STATE ---
        let state = {
            username: "",
            currentIdx: 0,
            score: 0,
            coins: 10,
            questions: [],
            history: [], 
            timer: null,
            timeLeft: 0,
            startTime: 0,
            isFrozen: false
        };

        window.onload = () => fetchLeaderboard('mini-leaderboard');

        async function handleLogin() {
            const user = document.getElementById('input-username').value.trim();
            if (!user) return;
            
            playSound('click');
            state.username = user;
            document.getElementById('view-auth').classList.add('hidden');
            document.getElementById('view-loading').classList.remove('hidden');

            const sEasy = [...questionBank.easy].sort(() => Math.random() - 0.5);
            const sMed = [...questionBank.medium].sort(() => Math.random() - 0.5);
            const sHard = [...questionBank.hard].sort(() => Math.random() - 0.5);
            state.questions = [...sEasy, ...sMed, ...sHard];

            setTimeout(() => {
                document.getElementById('view-loading').classList.add('hidden');
                document.getElementById('view-game').classList.remove('hidden');
                startLevel();
            }, 1000);
        }

        function startLevel() {
            if (state.currentIdx >= 30) {
                return finishGame();
            }

            if (state.currentIdx > 0 && state.currentIdx % 10 === 0) {
                state.coins += 50;
                showNotification("LEVEL SELESAI! +50 KOIN");
            }

            const q = state.questions[state.currentIdx];
            const levelNum = Math.floor(state.currentIdx / 10) + 1;
            
            // WAKTU 8-10 DETIK
            state.timeLeft = levelNum === 1 ? 10 : (levelNum === 2 ? 9 : 8);
            state.isFrozen = false;
            state.startTime = Date.now();

            updateUI();
            renderQuestion(q, levelNum);
            runTimer();
        }

        function renderQuestion(q, level) {

            container.innerHTML = '';
            const shuffledOptions = [...q.o].sort(() => Math.random() - 0.5);

                const btn = document.createElement('button');
                btn.className = "btn-answer w-full p-4 rounded-xl text-left font-bold text-lg flex items-center border border-white/5 bg-slate-800/50";
                btn.innerHTML = `<span class="w-8 h-8 rounded-lg bg-slate-700/50 flex items-center justify-center mr-4 text-blue-400 text-sm font-bold">${String.fromCharCode(65 + idx)}</span> <span>${opt}</span>`;
                btn.onclick = () => checkAnswer(opt, btn, q.a);
                container.appendChild(btn);
            });
        }

        function runTimer() {
            clearInterval(state.timer);
            const fill = document.getElementById('timer-fill');
            const container = document.getElementById('timer-container');
            const totalTime = state.timeLeft;

            state.timer = setInterval(() => {
                if (!state.isFrozen) {
                    state.timeLeft -= 0.1;
                    const pct = (state.timeLeft / totalTime) * 100;
                    fill.style.width = Math.max(0, pct) + "%";

                    if (state.timeLeft <= 3) {
                        fill.style.backgroundColor = "#ef4444";
                        container.classList.add('shake');
                    } else {
                        fill.style.backgroundColor = "";
                        container.classList.remove('shake');
                    }

                    if (state.timeLeft <= 0) {
                        clearInterval(state.timer);
                        handleTimeout();
                    }
                }
            }, 100);
        }

        function checkAnswer(choice, btn, correctAnswer) {
            clearInterval(state.timer);
            const q = state.questions[state.currentIdx];
            const allBtns = document.querySelectorAll('.btn-answer');
            const level = Math.floor(state.currentIdx / 10) + 1;
            const isCorrect = (choice === correctAnswer);

            allBtns.forEach(b => b.disabled = true);

            state.history.push({
                q: q.q,
                user: choice,
                correct: correctAnswer,
                isCorrect: isCorrect
            });

            if (isCorrect) {
                playSound('correct');
                btn.classList.add('bg-emerald-500/80', 'border-emerald-400');
                let points = 10 * level;
                if ((Date.now() - state.startTime) < 2000) points += 5;
                state.score += points;
                state.coins += 5;
            } else {
                playSound('wrong');
                btn.classList.add('bg-red-500/80', 'border-red-400');
                allBtns.forEach(b => {
                    if (b.innerText.includes(correctAnswer)) b.classList.add('bg-emerald-500/50', 'border-emerald-400');
                });
            }
            
            setTimeout(next, 1200);
        }

        function handleTimeout() {
            const q = state.questions[state.currentIdx];
            playSound('wrong');
            state.history.push({
                q: q.q,
                user: "Waktu Habis",
                correct: q.a,
                isCorrect: false
            });
            const allBtns = document.querySelectorAll('.btn-answer');
            allBtns.forEach(b => {
                b.disabled = true;
                if (b.innerText.includes(q.a)) b.classList.add('bg-emerald-500/50');
            });
            setTimeout(next, 1200);
        }

        function next() {
            state.currentIdx++;
            startLevel();
        }

        async function usePowerUp(type) {
            if (type === '5050' && state.coins >= 10) {
                playSound('click');
                state.coins -= 10;
                const q = state.questions[state.currentIdx];
                const allBtns = Array.from(document.querySelectorAll('.btn-answer'));
                allBtns.filter(b => !b.innerText.includes(q.a)).sort(() => Math.random() - 0.5).slice(0, 2).forEach(btn => {
                    btn.style.opacity = "0.2";
                    btn.disabled = true;
                });
            } else if (type === 'freeze' && state.coins >= 8) {
                playSound('click');
                state.coins -= 8;
                state.isFrozen = true;
                showNotification("WAKTU BEKU (5 DETIK)");
                setTimeout(() => state.isFrozen = false, 5000);
            } else if (type === 'skip' && state.coins >= 20) {
                playSound('click');
                state.coins -= 20;
                state.history.push({
                    q: state.questions[state.currentIdx].q,
                    user: "Diskip",
                    correct: state.questions[state.currentIdx].a,
                    isCorrect: true 
                });
                state.score += (10 * (Math.floor(state.currentIdx / 10) + 1));
                next();
            } else if (type === 'plus5' && state.coins >= 5) {
                playSound('click');
                state.coins -= 5;
                state.score += 5;
                showNotification("+5 POIN DITAMBAHKAN!");
            } else if (type === 'sabotage' && state.coins >= 30) {
                if (!supabaseClient) return showNotification("SABOTASE GAGAL (DB ERROR)");
                playSound('sabotage');
                state.coins -= 30;
                try {
                    const { data } = await supabaseClient.from('leaderboard').select('*').order('score', {descending:true}).limit(1);
                    if (data && data[0]) {
                        const target = data[0];
                        if (target.username === state.username) {
                            showNotification("ANDA ADALAH PERINGKAT 1!");
                            state.coins += 30;
                            return;
                        }
                        const newScore = Math.max(0, target.score - 50);
                        await supabaseClient.from('leaderboard').update({ score: newScore }).eq('id', target.id);
                        showNotification(`SABOTASE BERHASIL! ${target.username} -50 POIN`);
                    }
                } catch (e) { console.error(e); }
            }
            updateUI();
        }

        function updateUI() {
            document.getElementById('display-user').innerText = state.username;
            document.getElementById('display-progress').innerText = `${Math.min(30, state.currentIdx + 1)}/30`;
            document.getElementById('display-score').innerText = state.score;
            document.getElementById('display-coins').innerHTML = `<i class="fas fa-coins text-yellow-500"></i> ${state.coins}`;
            
            document.getElementById('btn-power-5050').disabled = state.coins < 10;
            document.getElementById('btn-power-freeze').disabled = state.coins < 8;
            document.getElementById('btn-power-skip').disabled = state.coins < 20;
            document.getElementById('btn-power-plus5').disabled = state.coins < 5;
            document.getElementById('btn-power-sabotage').disabled = state.coins < 30;
        }

        function showNotification(msg) {
            const t = document.createElement('div');
            t.className = "fixed top-20 left-1/2 -translate-x-1/2 bg-yellow-500 text-black px-6 py-2 rounded-full font-bold z-50 animate-bounce text-sm";
            t.innerText = msg;
            document.body.appendChild(t);
            setTimeout(() => t.remove(), 2500);
        }

        function renderReview() {
            const container = document.getElementById('review-container');
            container.innerHTML = '';
            state.history.forEach((item, idx) => {
                const div = document.createElement('div');
                div.className = `review-item ${item.isCorrect ? 'review-correct' : 'review-wrong'}`;
                div.innerHTML = `
                    <p class="font-bold">#${idx+1} ${item.q}</p>
                    <p>Jawaban Anda: <span class="${item.isCorrect ? 'text-emerald-400' : 'text-red-400'}">${item.user}</span></p>
                    ${!item.isCorrect ? `<p class="text-slate-400 italic">Harusnya: ${item.correct}</p>` : ''}
                `;
                container.appendChild(div);
            });
        }

        async function finishGame() {
            clearInterval(state.timer);
            document.getElementById('view-game').classList.add('hidden');
            document.getElementById('view-loading').classList.remove('hidden');
            
            renderReview();
            await updateSupabaseScore();
            
            document.getElementById('view-loading').classList.add('hidden');
            document.getElementById('view-result').classList.remove('hidden');
            document.getElementById('final-score').innerText = state.score;
            
            document.getElementById('result-title').innerText = "MISI SELESAI!";
            confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
            
            // Fetch Global Leaderboard untuk menentukan siapa yang tertinggi
            await fetchLeaderboard('final-leaderboard');
        }

        async function updateSupabaseScore() {
            if (!supabaseClient) return;
            try {
                await supabaseClient.from('leaderboard').insert([{ 
                    username: state.username, 
                    score: state.score, 
                    level_reached: 30 
                }]);
            } catch (err) { console.error(err); }
        }

        async function fetchLeaderboard(targetId) {
            const container = document.getElementById(targetId);
            if (!supabaseClient) {
                container.innerHTML = '<p class="text-[10px] text-slate-600 text-center">Leaderboard Offline</p>';
                return;
            }
            try {
                const { data, error } = await supabaseClient
                    .from('leaderboard')
                    .select('*')
                    .order('score', { ascending: false })
                    .limit(10);

                if (error) throw error;
                if (data) {
                    container.innerHTML = '';
                    data.forEach((row, idx) => {
                        const isUser = row.username === state.username;
                        const item = document.createElement('div');
                        item.className = `flex justify-between items-center p-3 rounded-xl border border-white/5 ${isUser ? 'bg-blue-600/30 border-blue-500' : 'bg-slate-900/30'}`;
                        item.innerHTML = `
                            <div class="flex items-center gap-3">
                                <span class="w-5 h-5 flex items-center justify-center rounded bg-slate-800 text-[10px] font-bold ${idx === 0 ? 'text-yellow-500' : 'text-slate-500'}">${idx + 1}</span>
                                <span class="font-bold ${isUser ? 'text-white' : 'text-slate-300'}">${row.username}</span>
                                ${idx === 0 ? '<i class="fas fa-crown text-yellow-500 text-[10px]"></i>' : ''}
                            </div>
                            <span class="text-yellow-400 font-bold">${row.score} pts</span>
                        `;
                        container.appendChild(item);

                        // Update Rank Badge untuk User Sekarang di halaman hasil
                        if (isUser && targetId === 'final-leaderboard') {
                            const badge = document.getElementById('rank-badge');
                            badge.innerText = `PERINGKAT ANDA: #${idx + 1}`;
                            if (idx === 0) {
                                badge.classList.add('bg-yellow-500/20', 'text-yellow-400', 'border-yellow-500/30');
                                badge.innerText = "👑 PERINGKAT #1 GLOBAL!";
                                confetti({ particleCount: 100, spread: 50, origin: { y: 0.8 } });
                            }
                        }
                    });
                }
            } catch (err) { container.innerHTML = '<p class="text-red-500 text-xs text-center">Gagal memuat data peringkat.</p>'; }
        }
    </script>
</body>
